# ==============================================================================
# YAMBAR — readable / balanced / T14s 1920x1080
# ==============================================================================

anchors:
  colors:
    bg:      &bg      0B111AFF
    bg2:     &bg2     121A23FF
    fg:      &fg      E2F1F8FF
    muted:   &muted   7F8A96FF
    primary: &primary 00D8C3FF
    accent:  &accent  FF6A2AFF
    warning: &warning FAD282FF
    danger:  &danger  D94A64FF

  spacing:
    module: &mod_space 10
    inner:  &in_space  5

  fonts:
    main:  &font_main  "Genos:style=Regular:pixelsize=16"
    small: &font_small "JetBrainsMono Nerd Font:style=Regular:pixelsize=13"
    icon:  &font_icon  "JetBrainsMono Nerd Font:style=Regular:pixelsize=14"
    time:  &font_time  "Genos:style=Regular:pixelsize=22"
    date:  &font_date  "Genos:style=Regular:pixelsize=21"

bar:
  height: 38
  location: top
  layer: top
  background: *bg
  foreground: *fg
  font: *font_main
  spacing: *mod_space
  left-margin: 14
  right-margin: 14

  # --------------------------------------------------------------------------
  # LEWO — workspace + aktywna aplikacja
  # --------------------------------------------------------------------------
  left:
    - i3:
        sort: native
        strip-workspace-numbers: true
        content:
          "":
            map:
              default:
                string:
                  text: "󰝦"
                  font: *font_icon
                  foreground: *muted
                  margin: 4
              conditions:
                state == focused:
                  string:
                    text: "󰝥"
                    font: *font_icon
                    foreground: *primary
                    margin: 4
                state == urgent:
                  string:
                    text: "󰀨"
                    font: *font_icon
                    foreground: *danger
                    margin: 4

    - foreign-toplevel:
        content:
          map:
            conditions:
              activated:
                list:
                  spacing: 6
                  items:
                    - string: {text: "󰖯", font: *font_icon, foreground: *muted}
                    - string: {text: "{app-id}", font: *font_main, foreground: *fg}

  # --------------------------------------------------------------------------
  # ŚRODEK — zegar + data jako jeden centralny blok
  # --------------------------------------------------------------------------
  center:
    - clock:
        time-format: "%H:%M"
        date-format: "%A, %d %b %Y"
        content:
          list:
            spacing: 10
            items:
              - string:
                  text: "{time}"
                  font: *font_time
                  foreground: *primary
              - string:
                  text: "·"
                  font: *font_date
                  foreground: *muted
              - string:
                  text: "{date}"
                  font: *font_date
                  foreground: *fg
                  deco:
                    underline:
                      size: 1
                      color: *primary

  # --------------------------------------------------------------------------
  # PRAWO — telemetryka | audio/sieć/bateria
  # --------------------------------------------------------------------------
  right:

    - cpu:
        poll-interval: 2000
        content:
          map:
            conditions:
              id == -1:
                map:
                  default:
                    list:
                      spacing: *in_space
                      items:
                        - string: {text: "CPU", font: *font_small, foreground: *muted}
                        - string: {text: "{cpu}%", font: *font_small, foreground: *fg}
                  conditions:
                    cpu > 85:
                      list:
                        spacing: *in_space
                        items:
                          - string: {text: "CPU", font: *font_small, foreground: *danger}
                          - string: {text: "{cpu}%", font: *font_small, foreground: *danger}
                    cpu > 60:
                      list:
                        spacing: *in_space
                        items:
                          - string: {text: "CPU", font: *font_small, foreground: *warning}
                          - string: {text: "{cpu}%", font: *font_small, foreground: *fg}

    - mem:
        poll-interval: 3000
        content:
          map:
            default:
              list:
                spacing: *in_space
                items:
                  - string: {text: "RAM", font: *font_small, foreground: *muted}
                  - string: {text: "{used:gib}G", font: *font_small, foreground: *fg}
            conditions:
              percent_used > 85:
                list:
                  spacing: *in_space
                  items:
                    - string: {text: "RAM", font: *font_small, foreground: *danger}
                    - string: {text: "{used:gib}G", font: *font_small, foreground: *danger}
              percent_used > 70:
                list:
                  spacing: *in_space
                  items:
                    - string: {text: "RAM", font: *font_small, foreground: *warning}
                    - string: {text: "{used:gib}G", font: *font_small, foreground: *fg}

    - script:
        path: ~/.config/yambar/scripts/disk_io.fish
        poll-interval: 2000
        content:
          list:
            spacing: *in_space
            items:
              - string: {text: "IO", font: *font_small, foreground: *muted}
              - string: {text: "{io}", font: *font_small, foreground: *fg}

    - label:
        content:
          string: {text: "│", font: *font_small, foreground: *muted, margin: 2}

    - pipewire:
        content:
          map:
            conditions:
              type == "sink":
                map:
                  conditions:
                    muted:
                      list:
                        spacing: *in_space
                        items:
                          - string:
                              text: "VOL"
                              font: *font_small
                              foreground: *muted
                          - string: {text: "mute", font: *font_small, foreground: *muted}
                    ~muted:
                      list:
                        spacing: *in_space
                        items:
                          - string:
                              text: "VOL"
                              font: *font_small
                              foreground: *primary
                          - string: {text: "{linear_volume}%", font: *font_small, foreground: *fg}

    - network:
        content:
          map:
            default: {empty: {}}
            conditions:
              name == "wlan0":
                map:
                  default:
                    list:
                      spacing: *in_space
                      items:
                        - string: {text: "WIFI", font: *font_small, foreground: *muted}
                        - string: {text: "...", font: *font_small, foreground: *muted}
                  conditions:
                    state == down:
                      list:
                        spacing: *in_space
                        items:
                          - string: {text: "WIFI", font: *font_small, foreground: *muted}
                          - string: {text: "offline", font: *font_small, foreground: *muted}
                    state == up:
                      map:
                        default:
                          list:
                            spacing: *in_space
                            items:
                              - string: {text: "WIFI", font: *font_small, foreground: *primary}
                              - string: {text: "{ssid}", font: *font_small, foreground: *fg}
                        conditions:
                          ipv4 == "":
                            list:
                              spacing: *in_space
                              items:
                                - string: {text: "WIFI", font: *font_small, foreground: *warning}
                                - string: {text: "łączenie", font: *font_small, foreground: *warning}

    - battery:
        name: BAT0
        poll-interval: 30000
        content:
          map:
            default:
              list:
                spacing: *in_space
                items:
                  - string: {text: "BAT", font: *font_small, foreground: *muted}
                  - string: {text: "{capacity}%", font: *font_small, foreground: *fg}
            conditions:
              state == charging:
                list:
                  spacing: *in_space
                  items:
                    - string: {text: "BAT", font: *font_small, foreground: *primary}
                    - string: {text: "{capacity}%", font: *font_small, foreground: *primary}
              state == discharging:
                map:
                  default:
                    list:
                      spacing: *in_space
                      items:
                        - string: {text: "BAT", font: *font_small, foreground: *muted}
                        - string: {text: "{capacity}%", font: *font_small, foreground: *fg}
                  conditions:
                    capacity < 15:
                      list:
                        spacing: *in_space
                        items:
                          - string: {text: "BAT", font: *font_small, foreground: *danger}
                          - string: {text: "{capacity}%", font: *font_small, foreground: *danger}
                    capacity < 30:
                      list:
                        spacing: *in_space
                        items:
                          - string: {text: "BAT", font: *font_small, foreground: *warning}
                          - string: {text: "{capacity}%", font: *font_small, foreground: *warning}
